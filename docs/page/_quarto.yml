project:
  type: website
  output-dir: _site
  pre-render: python sync_notebooks.py --verbose

execute:
  enabled: false

website:
  title: "TimeToAlign!"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials.qmd
        text: Tutorials
      - href: howto.qmd
        text: How-To Guides
      - href: concepts.qmd
        text: Explanation
      - href: reference.qmd
        text: API Reference
  sidebar:
    - title: "Tutorials"
      contents:
        - tutorials.qmd
        - section: "Timelines, Events & Maps"
          contents:
            - text: "Quickstart"
              href: tutorials/tut00_quickstart.ipynb
            - text: "Timelines, Events, and Maps"
              href: tutorials/tut01a_timelines_events_maps.ipynb
            - text: "Children, Regions, and Timestamps"
              href: tutorials/tut01b_children_regions_timestamps.ipynb
        - section: "TimelineGroups"
          contents:
            - text: "Timeline Groups and Commensurability"
              href: tutorials/tut02_timeline_groups.ipynb
        - section: "AlignmentBundles"
          contents:
            - text: "Alignment Bundles"
              href: tutorials/tut03_alignment_bundles.ipynb
        - section: "In-depth Topics"
          contents:
            - text: "Flow Control and Grids"
              href: tutorials/tut04_flow_and_grids.ipynb

    - title: "How-To Guides"
      contents:
        - howto.qmd
        - section: "Timelines, Events & Maps"
          contents:
            - text: "How to Do Coordinate Math"
              href: howto/how01_coordinate_math.ipynb
            - text: "How to Use Advanced Conversion Maps"
              href: howto/how01_advanced_cmaps.ipynb
            - text: "How to Query Timestamps"
              href: howto/how01_advanced_timestamps.ipynb
            - text: "How to Construct Timelines Manually"
              href: howto/how01_manual_timeline_construction.ipynb
            - text: "How to Load Data"
              href: howto/how01_loading_data.ipynb
            - text: "How to Load Tabular Data"
              href: howto/how01_tabular_loaders.ipynb
            - text: "How to Work with Graphical Timelines"
              href: howto/how01_graphical_timelines.ipynb
            - text: "How to Build Beat Grids"
              href: howto/how01_beat_grids.ipynb
        - section: "TimelineGroups"
          contents:
            - text: "How to Align a Piano Roll (SUPRA)"
              href: howto/how02_supra_piano_roll.ipynb
        - section: "AlignmentBundles"
          contents:
            - text: "How to Create a Note Alignment"
              href: howto/how03_create_note_alignment.ipynb
            - text: "How to Align Multimodal Data (Beethoven)"
              href: howto/how03_beethoven_multimodal.ipynb
            - text: "How to Load the Vienna 4x22 Corpus"
              href: howto/how03_loading_vienna_corpus.ipynb

    - title: "Explanation"
      contents:
        - concepts.qmd
        - section: "Quick Reference"
          contents:
            - glossary.qmd

    - title: "API Reference"
      contents:
        - reference.qmd
        - auto: reference

metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - reference/_styles-quartodoc.css
    toc: true
    toc-depth: 4

filters:
  - glossary
  - interlinks

glossary:
  path: glossary.yml
  popup: hover
  show: true

interlinks:
  sources: {}

quartodoc:
  package: timetoalign
  dir: reference
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  title: API Reference
  style: pkgdown
  render_interlinks: true
  sections:
    - title: Core Types
      desc: Fundamental types for coordinates, units, and domains.
      contents:
        - Coordinate
        - CoordinateSpec
        - CoordinateValue
        - IdCoordinate
        - Domain
        - TimeUnit
        - NumberType
        - EventType
        - ScopedId
        - IdGenerator

    - title: Timelines
      desc: Timeline classes for all six domain/modality combinations.
      contents:
        - Timeline
        - ContinuousLogicalTimeline
        - DiscreteLogicalTimeline
        - ContinuousPhysicalTimeline
        - DiscretePhysicalTimeline
        - ContinuousGraphicalTimeline
        - DiscreteGraphicalTimeline
        - LogicalTimeline
        - PhysicalTimeline
        - GraphicalTimeline
        - BeatGrid

    - title: Conversion Maps
      desc: Functions for transforming coordinates between units.
      contents:
        - ConversionMap
        - ScalarMap
        - LinearMap
        - ShiftMap
        - TableMap
        - ChainMap
        - PiecewiseMap
        - SecondsToSamples

    - title: Alignment
      desc: Classes for connecting and aligning timelines.
      contents:
        - TimelineGroup
        - PerfectAlignment
        - AlignmentBundle
        - AlignmentAnchor
        - MatchClaim
        - MatchMetadata
        - MatchGraph
        - MatchStamp
        - MatchLine
        - WarpMap
        - ClaimFilter
        - TimelineIdGenerator

    - title: Loaders
      desc: Data ingestion from various file formats.
      contents:
        - Loader
        - EventData
        - EventStore
        - SingleStore
        - DictStore
        - AudioLoader
        - AudioInfo
        - RepoVizzLoader
        - RepoVizzInfo
        - EepNotesLoader
        - name: MatchfileLoader
          package: timetoalign.loader.alignment.matchfile
        - name: TiliaJsonLoader
          package: timetoalign.loader.alignment.tilia
        - name: TiliaDictStore
          package: timetoalign.loader.alignment.tilia
