project:
  type: website
  output-dir: _site
  pre-render: python sync_notebooks.py --verbose

execute:
  enabled: false

website:
  title: "TimeToAlign!"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials.qmd
        text: Tutorials
      - href: howto.qmd
        text: How-To Guides
      - href: concepts.qmd
        text: Explanation
      - href: reference.qmd
        text: API Reference
  sidebar:
    - title: "Tutorials"
      contents:
        - tutorials.qmd
        - section: "Foundations"
          contents:
            - tutorials/00_motivation.ipynb
            - tutorials/01a_timelines_events_maps.ipynb
            - tutorials/01b_children_regions_timestamps.ipynb
        - section: "Alignment"
          contents:
            - tutorials/02_timeline_groups.ipynb
            - tutorials/03_alignment_bundles.ipynb
        - section: "Advanced"
          contents:
            - tutorials/04_flow_and_grids.ipynb

    - title: "How-To Guides"
      contents:
        - howto.qmd
        - section: "Topic 1: Timelines, Events & Maps"
          contents:
            - howto/how01_coordinate_math.ipynb
            - howto/how01_advanced_cmaps.ipynb
            - howto/how01_advanced_timestamps.ipynb
            - howto/how01_manual_timeline_construction.ipynb
            - howto/how01_loading_data.ipynb
            - howto/how01_tabular_loaders.ipynb
            - howto/how01_graphical_timelines.ipynb
            - howto/how01_beat_grids.ipynb
        - section: "Topic 2: TimelineGroups"
          contents:
            - howto/how02_supra_piano_roll.ipynb
        - section: "Topic 3: AlignmentBundles"
          contents:
            - howto/how03_beethoven_multimodal.ipynb
            - howto/how03_loading_vienna_corpus.ipynb

    - title: "Explanation"
      contents:
        - concepts.qmd
        - section: "Quick Reference"
          contents:
            - glossary.qmd

    - title: "API Reference"
      contents:
        - reference.qmd
        - auto: reference

metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - reference/_styles-quartodoc.css
    toc: true
    toc-depth: 4

filters:
  - glossary
  - interlinks

glossary:
  path: glossary.yml
  popup: hover
  show: true

interlinks:
  sources: {}

quartodoc:
  package: timetoalign
  dir: reference
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  title: API Reference
  style: pkgdown
  render_interlinks: true
  sections:
    - title: Core Types
      desc: Fundamental types for coordinates, units, and domains.
      contents:
        - Coordinate
        - CoordinateSpec
        - CoordinateValue
        - IdCoordinate
        - Domain
        - TimeUnit
        - NumberType
        - EventType
        - ScopedId
        - IdGenerator

    - title: Timelines
      desc: Timeline classes for all six domain/modality combinations.
      contents:
        - Timeline
        - ContinuousLogicalTimeline
        - DiscreteLogicalTimeline
        - ContinuousPhysicalTimeline
        - DiscretePhysicalTimeline
        - ContinuousGraphicalTimeline
        - DiscreteGraphicalTimeline
        - LogicalTimeline
        - PhysicalTimeline
        - GraphicalTimeline
        - BeatGrid

    - title: Conversion Maps
      desc: Functions for transforming coordinates between units.
      contents:
        - ConversionMap
        - ScalarMap
        - LinearMap
        - ShiftMap
        - TableMap
        - ChainMap
        - PiecewiseMap
        - SecondsToSamples

    - title: Alignment
      desc: Classes for connecting and aligning timelines.
      contents:
        - TimelineGroup
        - PerfectAlignment
        - AlignmentBundle
        - AlignmentAnchor
        - MatchClaim
        - MatchMetadata

    - title: Loaders
      desc: Data ingestion from various file formats.
      contents:
        - Loader
        - EventData
        - EventStore
        - SingleStore
        - AudioLoader
        - AudioInfo
        - RepoVizzLoader
        - RepoVizzInfo
        - EepNotesLoader
