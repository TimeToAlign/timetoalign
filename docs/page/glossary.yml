# TimeToAlign! Glossary of Terms
# Alphabetical listing of model terminology
# Last updated: 2026-02-28 — Harmonized with TISMIR manuscript glossary table;
# added FlowMap, aligned all definitions with article.

AlignmentAnchor: |
  A coordinate pair associating one coordinate on timeline A with one on
  timeline B; a neutral record with no claim semantics. Provenance and
  interpretation are carried by the enclosing MatchClaim. Only synchronous
  MatchClaims produce AlignmentAnchors.

AlignmentBundle: |
  A collection of TimelineGroups with inter-group MatchClaim connections;
  provides coordinate transfer via offset arithmetic, interpolation, and
  WarpMaps.

Break: |
  A control event that voids contiguity at its Instant. TimeIntervals cannot span
  a Break, and Breaks cannot be inserted into existing TimeIntervals.

ChainMap: |
  A MultiMap that applies multiple ConversionMaps in sequence, creating a conversion
  path from source to target unit.

Child: |
  A timeline nested within a parent, sharing its measuring unit but defining
  its own origin. Coordinate transfer between parent and child uses exact offset
  arithmetic, applied recursively. Children are locked upon insertion.

CombinationMap: |
  A MultiMap yielding outputs from multiple ConversionMaps simultaneously
  (e.g., (x, y) coordinate pairs).

Commensurability: |
  Two timelines are commensurable if connected by a chain of C-maps, membership
  in the same TimelineGroup, or cross-group MatchClaims, enabling coordinate
  translation between them.

Commensurable: |
  See Commensurability.

ConcatenationMap: |
  A MultiMap combining bounded ConversionMaps such that each coordinate region is
  handled by a specific map. Also called PiecewiseMap.

Contiguity: |
  A TimeInterval is contiguous if it monotonically spans all coordinates between
  its start and end. An Instant is contiguous with a TimeInterval if it is
  synchronous with its EndInstant.

ControlEvent: |
  An event affecting flow control: either a Break (voiding contiguity) or a Jump
  (creating new contiguity).

ConversionMap: |
  A typed function attached to a timeline that maps each coordinate to exactly
  one value (coordinate, label, or filename); also permits inverse conversion
  back to the timeline's own unit. Also called C-map.

Coordinate: |
  A position on a timeline, expressed as the distance from the origin in the
  timeline's measuring unit. Combines a numeric value with a TimeUnit.

FlowMap: |
  A sequence of TimeIntervals specifying a particular path through a score's
  control structure (repeats, jumps); not itself a timeline. Used for
  unfolding a score into performance order.

GroupTimestamp: |
  A cross-section through a TimelineGroup at a given coordinate. Contains
  one coordinate per timeline in the group plus (optionally) C-map conversion
  values. A MatchStamp is the union of GroupTimestamps from each participating
  group. Produced by TimelineGroup.get_timestamp_at().

DictStore: |
  A generic EventStore subclass holding a dict[str, EventData] with arbitrary
  keys. Used internally by AlignmentLoaders to store one EventData table per
  timeline-to-be (e.g., "score", "perf:p01", "perf:p02"). Maintains the
  uniform EventStore interface (iteration, keys, items, getitem).

Discrete: |
  A timeline is discrete when coordinates exist only at discrete points
  (e.g., pixels, samples, ticks). Contrast with Continuous timelines where
  coordinates can take any real value (e.g., seconds, quarters).

Domain: |
  One of three temporal categories: Graphical (visual/spatial), Logical
  (symbolic/musical), or Physical (audio/sound). Each domain has both
  discrete and continuous timeline variants.

EndAnchor: "The second AlignmentAnchor of a synchronous interval MatchClaim, derived from the end coordinates."

EndInstant: |
  An Instant marking the end of a TimeInterval. Implies the presence of a
  corresponding StartInstant with coordinate <= EndInstant's coordinate.

Event: |
  Anything associated with a timeline via Instants. An InstantEvent has zero
  duration; a TimeIntervalEvent has duration defined by start and end coordinates.

Instant: |
  Associates a coordinate (a "time-point") with a signification such as
  "start of event e". Instants sharing a coordinate are synchronous.

InstantEvent: |
  An event defined by a single Instant, having zero duration. Contrast with
  TimeIntervalEvent which has a duration.

InverseMap: "The reverse transformation of a bijective ConversionMap."

Jump: |
  A control event with JumpFrom and JumpTo Instants. When active, makes events
  at JumpTo contiguous with those ending at JumpFrom (e.g., repeats, dal segno).

JumpFrom: "The originating Instant of a Jump control event."

JumpTo: "The destination Instant of a Jump control event."

Length: |
  The distance between a timeline's origin and its last Instant. A locked
  timeline cannot extend its length.

Locked: |
  A timeline state preventing the addition of Instants after the last time-point.
  Child timelines are automatically locked when embedded in a parent.

MatchfileLoader: |
  Loader for Vienna Match (.match) alignment files. Uses the standard two-phase
  load() → create_*() pattern. A single instance processes all .match files that
  share the same score, building a shared score timeline on the first file and
  verifying subsequent files against it. Returns an AlignmentBundle directly via
  create_alignment_bundle(). Score goes into its own group; performances are
  standalone timelines; MatchClaims connect score to performances.

MatchClaim: |
  A claim of equivalence between events on different timelines, with provenance
  metadata (agent, method, certainty). May be synchronous (producing
  AlignmentAnchors) or conceptual (structural equivalence without temporal
  commitment). Always knows which pair of timelines it connects. Four cases:
  (a) event-to-event, (b) projection, (c) NOMATCH, (d) implicit (from group
  extension).

MatchGraph: |
  An auxiliary structure formed by extending MatchClaims through shared
  coordinates; may be viewed as a hyperedge connecting multiple coordinates
  from different timelines. Connected components yield MatchStamps. Each
  Match box M1–M15 in the Hendrix figure is a MatchGraph.

MatchLine: |
  An ordered sequence of AlignmentAnchors derived from MatchClaims, sorted by
  coordinate on a source timeline; input for WarpMap generation.

MatchStamp: |
  The union of TimeStamps from groups synchronously connected by a MatchGraph.
  Contains one coordinate per participating timeline and, with
  conversion_maps=True (the default), C-map conversion values.

MetricMap: |
  A table-based ConversionMap from a quarter position to its measure count,
  built from explicit measure-boundary anchors rather than a uniform measure
  length. Correctly handles anacrusis (incomplete first measure), irregular
  measures, varying time signatures, and repeat structure. Built directly from
  a Verovio timemap via MetricMap.from_verovio_timemap(). Not invertible (many
  quarters map to the same measure).

MetricalPositionMap: |
  A CombinationMap pairing a MetricMap with a beat-in-measure map to return a
  metrical position {mc, beat} from a quarter coordinate. Adds a reverse lookup
  quarters_at(mc, beat) (metrical position → quarters) and mn_at(quarters)
  (quarters → measure-number label).

MpmLoader: |
  Loader for an MPM-Toolbox project: a sibling .msm score, .mpm modelled
  performance, and .mpr project file (carrying an observed audio-to-score
  alignment) for one work. Uses the standard two-phase load() → create_*()
  pattern. Builds a shared logical "score" group holding the notes in two units
  — a ticks DiscreteLogicalTimeline (also carrying every MPM markup event:
  Tempo, Dynamics, Articulation, …) and a quarters ContinuousLogicalTimeline —
  with a TicksToQuarters map and a modelled quarters→seconds TableMap integrated
  from the performance's tempo markup; and a physical "perf" group of observed
  onsets in seconds and samples. Emits one synchronous cross-group MatchClaim
  per score note (the MSM xml:id ↔ MPR ref join is a bijection). Reads the
  modelled performance and the observed alignment; never runs an aligner.
  Returns an AlignmentBundle via create_bundle().

MultiMap: |
  An umbrella term for composed ConversionMaps: ChainMap (sequential),
  CombinationMap (parallel outputs), and ConcatenationMap (regional).

NOMATCH: |
  A sentinel value in a MatchClaim explicitly encoding the absence of a
  corresponding event on the other timeline. The MatchClaim records both
  timeline IDs but has no AlignmentAnchors; is_synchronous is always False.

Origin: "The zero coordinate of a timeline, from which all positions are measured."

PerformancePrecisionLoader: |
  Loader for audio-to-score alignment specimens: a directory bundling a .solo
  score, a Verovio timemap, and per-performer alignment files at the note, bar,
  and beat granularities. Uses the standard two-phase load() → create_*()
  pattern. Resolves every "<measure>+<offset>" label to absolute quarters via a
  MetricMap, builds one logical score timeline (quarters) and one physical
  performance timeline per recording (seconds), and emits a MatchClaim per
  alignment row — synchronous for located onsets, NOMATCH for the dangling ones.
  Returns an AlignmentBundle via create_bundle().

ParangonadaLoader: |
  Loader for a parangonar parangonada export: per-performance CSV triples (score
  notes, performed notes, note-level correspondences) for one work. Uses the
  standard two-phase load() → create_*() pattern. Parses the shared score once
  into two logical timelines (quarters and division-grid ticks, linked by a
  divs→quarters LinearMap), builds one performance group per recording with two
  physical timelines (seconds and samples, linked by a SamplesToSeconds map),
  and emits one cross-group MatchClaim per correspondence — synchronous for a
  matched note, NOMATCH for a score-only or performance-only note. Reads the
  existing alignment; never runs an aligner. Returns an AlignmentBundle via
  create_bundle().

Parent: |
  A timeline that contains one or more Child timelines. The parent and all
  its children must share the same measuring unit. Coordinate transfer uses
  exact offset arithmetic.

Region: |
  A named part of a timeline defined by a TimeInterval (e.g., "Chorus", "Verse").
  Regions are not timelines and cannot hold events or maps directly.

raw_to_normalised: |
  The conventional name for the ShiftMap attached to a score timeline to expose
  normalised (non-negative) coordinates. Its offset equals −min(raw_onsets).
  Added by MatchfileLoader and PartituraLoader so downstream code can detect
  and apply the same shift when comparing coordinates across loaders.

Root: |
  The top-level timeline in a hierarchy of nested timelines. Only the root
  timeline can be extended; all descendants are locked.

RotationMap: |
  A periodic ConversionMap that wraps coordinates cyclically. Used for
  modelling repeating patterns such as an ostinato whose local structure
  recurs while the parent timeline advances.

Segment: |
  A Child timeline that is contiguous with its siblings. Segments enable
  concatenation of local coordinate systems.

SegmentLine: |
  A parent timeline containing only contiguous Segments. Enables cumulative
  coordinate conversion across all segments.

StartAnchor: "The first AlignmentAnchor of a synchronous MatchClaim, derived from the start coordinates."

StartInstant: |
  An Instant marking the start of a TimeInterval. Implies the presence of a
  corresponding EndInstant with coordinate >= StartInstant's coordinate.

Synchrony: |
  Strict synchrony: Instants sharing identical coordinates. Pragmatic synchrony:
  Instants binned together based on a threshold (e.g., for quantisation).

TimelineGroup: |
  A container for timelines claimed to be commensurable; placing timelines in
  a group asserts commensurability regardless of underlying units. Coordinates
  transfer via interpolation.

TimeInterval: |
  Defined by a StartInstant and EndInstant; left-inclusive and right-exclusive
  [s, e). The EndInstant's coordinate must be >= the StartInstant's.

TimeIntervalEvent: |
  An event with duration, defined by a TimeInterval (start and end coordinates).
  Contrast with InstantEvent which has zero duration.

TimeIntervalStamp: |
  Combination of a start TimeStamp and an end TimeStamp, representing a
  cross-section of an interval through the timeline hierarchy.

Timeline: |
  A positive coordinate axis defined by an origin and a measuring unit;
  continuous (real) or discrete (integer). Accommodates events and potentially
  Child timelines.

TimeStamp: |
  A cross-section through a timeline or group at a given coordinate, capturing
  positions in all connected systems plus values converted by all attached
  C-maps.

WarpMap: |
  An interpolation-based coordinate mapping derived from a MatchLine; enables
  non-linear coordinate transfer between TimelineGroups.
