# TimeToAlign! Glossary of Terms
# Alphabetical listing of model terminology
# Last updated: 2026-02-24 — Alignment architecture overhaul (MatchClaim cases,
# AlignmentAnchor stripped to pure coordinate pair, MatchGraph = each Hendrix M-box,
# WarpMap materialises timeline copies from MatchLine).

AlignmentAnchor: |
  A pure coordinate pair associating one coordinate on timeline A with one
  coordinate on timeline B. The atomic unit of alignment data. Contains no
  metadata and no claim semantics — it is a neutral record of two associated
  coordinates. Provenance and interpretation are carried by the enclosing
  MatchClaim. Only synchronous MatchClaims produce AlignmentAnchors.

AlignmentBundle: |
  The top-level container for alignment workflows, holding timelines, groups,
  and cross-group MatchClaims. Provides coordinate transfer within groups (via
  interpolation) and across groups (via MatchLine and WarpMap). Not a graph.

Break: |
  A control event that voids contiguity at its Instant. TimeIntervals cannot span
  a Break, and Breaks cannot be inserted into existing TimeIntervals.

ChainMap: |
  A MultiMap that applies multiple ConversionMaps in sequence, creating a conversion
  path from source to target unit.

Child: |
  A timeline nested within a parent timeline, sharing the same measuring unit.
  Coordinate transfer between parent and child uses exact offset arithmetic
  (addition/subtraction), applied recursively. Children are locked upon insertion.

CombinationMap: |
  A MultiMap yielding outputs from multiple ConversionMaps simultaneously
  (e.g., (x, y) coordinate pairs).

Commensurable: |
  Two timelines are commensurable when connected by a ConversionMap chain (within
  a timeline), TimelineGroup membership (within a group), or a MatchClaim chain
  (across groups), enabling coordinate translation between them.

ConcatenationMap: |
  A MultiMap combining bounded ConversionMaps such that each coordinate region is
  handled by a specific map. Also called PiecewiseMap.

Contiguity: |
  A TimeInterval is contiguous if it monotonically spans all coordinates between
  its start and end. An Instant is contiguous with a TimeInterval if it is
  synchronous with its EndInstant.

ControlEvent: |
  An event affecting flow control: either a Break (voiding contiguity) or a Jump
  (creating new contiguity).

ConversionMap: |
  A typed function attached to a single timeline, mapping any coordinate to at most
  one value (another coordinate, specifier, or constant). Also called C-map.
  C-Maps are properties of the timeline they belong to, not edges between timelines.

Coordinate: |
  A position on a timeline, expressed as the distance from the origin in the
  timeline's measuring unit. Combines a numeric value with a TimeUnit.

DictStore: |
  A generic EventStore subclass holding a dict[str, EventData] with arbitrary
  keys. Used internally by AlignmentLoaders to store one EventData table per
  timeline-to-be (e.g., "score", "perf:p01", "perf:p02"). Maintains the
  uniform EventStore interface (iteration, keys, items, getitem).

Discrete: |
  A timeline is discrete when coordinates exist only at discrete points
  (e.g., pixels, samples, ticks). Contrast with Continuous timelines where
  coordinates can take any real value (e.g., seconds, quarters).

Domain: |
  One of three temporal categories: Graphical (visual/spatial), Logical
  (symbolic/musical), or Physical (audio/sound). Each domain has both
  discrete and continuous timeline variants.

EndAnchor: "The second AlignmentAnchor of a synchronous interval MatchClaim, derived from the end coordinates."

EndInstant: |
  An Instant marking the end of a TimeInterval. Implies the presence of a
  corresponding StartInstant with coordinate <= EndInstant's coordinate.

Event: |
  Anything associated with a timeline via Instants. An InstantEvent has zero
  duration; a TimeIntervalEvent has duration defined by start and end coordinates.

Instant: |
  Associates a coordinate (a "time-point") with a signification such as
  "start of event e". Instants sharing a coordinate are synchronous.

InstantEvent: |
  An event defined by a single Instant, having zero duration. Contrast with
  TimeIntervalEvent which has a duration.

InverseMap: "The reverse transformation of a bijective ConversionMap."

Jump: |
  A control event with JumpFrom and JumpTo Instants. When active, makes events
  at JumpTo contiguous with those ending at JumpFrom (e.g., repeats, dal segno).

JumpFrom: "The originating Instant of a Jump control event."

JumpTo: "The destination Instant of a Jump control event."

Length: |
  The distance between a timeline's origin and its last Instant. A locked
  timeline cannot extend its length.

Locked: |
  A timeline state preventing the addition of Instants after the last time-point.
  Child timelines are automatically locked when embedded in a parent.

MatchfileLoader: |
  Loader for Vienna Match (.match) alignment files. Uses the standard two-phase
  load() → create_*() pattern. A single instance processes all .match files that
  share the same score, building a shared score timeline on the first file and
  verifying subsequent files against it. Returns an AlignmentBundle directly via
  create_alignment_bundle(). Score goes into its own group; performances are
  standalone timelines; MatchClaims connect score to performances.

MatchClaim: |
  A claim — issued by a human or algorithmic agent — about one or two timed things
  (events, regions, children) on two specific timelines. Always knows which pair of
  timelines it connects. Contains 0-2 AlignmentAnchors (only if synchronous),
  synchrony and explicitness flags, and optional MatchMetadata (agent, decision
  criteria, certainty). Four cases: (a) ID<->ID, (b) ID->coord (projection),
  (c) ID->NOMATCH, (d) implicit (from group extension). The manuscript shorthand
  "Match" refers to this concept.

MatchGraph: |
  An on-demand analytical structure built from MatchClaims using a networkx graph.
  Nodes are (timeline_id, coordinate) tuples; edges derive from AlignmentAnchors
  of synchronous claims. Connected components yield MatchStamps. Can be extended
  with implicit claims based on group membership. Each "Match" box M1-M15 in the
  Hendrix figure is a MatchGraph, not a single MatchClaim.

MatchLine: |
  An ordered sequence of MatchStamps for a given source timeline, sorted by
  coordinate on that source timeline. Created by selecting and resolving
  MatchClaims (all or filtered subset). Used as input for WarpMap generation.
  In the Hendrix example, the "inferred chord event alignment" is based on
  a MatchLine selecting MatchGraphs M6-M9.

MatchStamp: |
  A synchronised instant across multiple timelines, extracted from a MatchGraph's
  connected components. Contains one coordinate per participating timeline.
  Can be expanded with group-member coordinates and C-map conversions.

MultiMap: |
  An umbrella term for composed ConversionMaps: ChainMap (sequential),
  CombinationMap (parallel outputs), and ConcatenationMap (regional).

NOMATCH: |
  A sentinel value in a MatchClaim explicitly encoding the absence of a
  corresponding event on the other timeline. The MatchClaim records both
  timeline IDs but has no AlignmentAnchors; is_synchronous is always False.

Origin: "The zero coordinate of a timeline, from which all positions are measured."

Parent: |
  A timeline that contains one or more Child timelines. The parent and all
  its children must share the same measuring unit. Coordinate transfer uses
  exact offset arithmetic.

Region: |
  A named part of a timeline defined by a TimeInterval (e.g., "Chorus", "Verse").
  Regions are not timelines and cannot hold events or maps directly.

raw_to_normalised: |
  The conventional name for the ShiftMap attached to a score timeline to expose
  normalised (non-negative) coordinates. Its offset equals −min(raw_onsets).
  Added by MatchfileLoader and PartituraLoader so downstream code can detect
  and apply the same shift when comparing coordinates across loaders.

Root: |
  The top-level timeline in a hierarchy of nested timelines. Only the root
  timeline can be extended; all descendants are locked.

RotationMap: |
  A periodic ConversionMap that wraps coordinates cyclically. Used for
  modelling repeating patterns such as an ostinato whose local structure
  recurs while the parent timeline advances.

Segment: |
  A Child timeline that is contiguous with its siblings. Segments enable
  concatenation of local coordinate systems.

SegmentLine: |
  A parent timeline containing only contiguous Segments. Enables cumulative
  coordinate conversion across all segments.

StartAnchor: "The first AlignmentAnchor of a synchronous MatchClaim, derived from the start coordinates."

StartInstant: |
  An Instant marking the start of a TimeInterval. Implies the presence of a
  corresponding EndInstant with coordinate >= StartInstant's coordinate.

Synchrony: |
  Strict synchrony: Instants sharing identical coordinates. Pragmatic synchrony:
  Instants binned together based on a threshold (e.g., for quantisation).

TimelineGroup: |
  A container for commensurable timelines, connected via a shared timestamp table
  and pairwise InterpolationMaps. Enables coordinate transfer between timelines
  of potentially different units via linear interpolation.

TimeInterval: |
  Defined by a StartInstant and EndInstant; left-inclusive and right-exclusive
  [s, e). The EndInstant's coordinate must be >= the StartInstant's.

TimeIntervalEvent: |
  An event with duration, defined by a TimeInterval (start and end coordinates).
  Contrast with InstantEvent which has zero duration.

TimeIntervalStamp: |
  Combination of a start TimeStamp and an end TimeStamp, representing a
  cross-section of an interval through the timeline hierarchy.

Timeline: |
  A positive coordinate axis minimally defined by its origin (zero) and
  measuring unit. Accommodates events and potentially Child timelines.

TimeStamp: |
  A cross-section through a timeline hierarchy at a given coordinate. Computes
  equivalent coordinates on children (via offset arithmetic) and on attached
  C-map target units. The single API for coordinate resolution, using separate
  internal methods for parent-child (shift) and group (interpolation) lookups.

TraversalMap: |
  A sequence of TimeIntervals representing a specific traversal path through
  a timeline (handling Jumps and repeats). Also called T-map.

WarpMap: |
  A standalone class that produces a materialised copy of a source timeline
  (including its children, events, regions, etc.), warped to the coordinate
  system of a target timeline. Generated from a MatchLine by extracting
  coordinate pairs and building an interpolation table. If source and target
  have different units, the warped copy changes timeline type. Uses
  InterpolationMap (numpy.interp) under the hood.
